[project]
name = "resolveai-workspace"
version = "0.0.1"
description = "Adversarially-Hardened Multi-Agent Customer Support — workspace root"
readme = "README.md"
requires-python = ">=3.11"

# 顶层不直接发布，只是 workspace 容器；声明 API 成员以便根目录 `uv run pytest` 等能导入 resolveai_api
dependencies = [
    "resolveai-api",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/mcp-servers/zendesk",
    "packages/mcp-servers/stripe",
    "packages/mcp-servers/slack",
    "packages/mcp-servers/salesforce",
    "packages/mcp-servers/intercom",
]

[tool.uv.sources]
resolveai-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

# ---------------- ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM"]
# RUF001/RUF002/RUF003: 中英混排里常见全角标点，与 ASCII 混用会误报
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"e2e_tests/**" = ["S101", "ANN"]

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["build", "dist", "apps/web"]

# ---------------- pytest ----------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["apps/api/tests", "packages", "e2e_tests"]
asyncio_mode = "auto"
