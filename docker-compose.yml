services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveai-postgres
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # RLS migration runs after 01-init (alphabetical order), once tables exist:
      # enables/forces row-level security + creates the low-privilege resolveai_app
      # role so a fresh container has RLS actually enforced (dev == prod shape).
      - ./infra/docker/migrations/0001_rls.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- Observability stack (M11 · `--profile obs`) ----------------
  # trace → OTel Collector → Tempo; app /metrics → Prometheus; both → Grafana.
  # Image tags are pinned (no `latest`) for reproducible dashboards.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: resolveai-otel
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./infra/docker/otel-config.yaml:/etc/otel-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (API exporter → collector)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus-format metrics exposed by the collector
    depends_on:
      - tempo
    profiles: ["obs"]

  tempo:
    image: grafana/tempo:2.7.0
    container_name: resolveai-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API (Grafana datasource)
    profiles: ["obs"]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: resolveai-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    # Scrape the API `/metrics` running on the host (`make api`) via host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: resolveai-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"   # Grafana UI (3000 is taken by the Next.js web app)
    depends_on:
      - prometheus
      - tempo
    profiles: ["obs"]

volumes:
  postgres_data:
  tempo_data:
  prometheus_data:
  grafana_data:
