name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python (uv / ruff / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Ruff
        run: uv run ruff check .

      # Type gate (M15): source + reusable packages must be mypy-clean. Test files
      # are intentionally out of scope for now (see docs/milestone-15-plan.md).
      - name: Mypy (type gate)
        run: uv run mypy apps/api/src packages

      - name: Pytest
        run: uv run python -m pytest -q

  frontend:
    name: Next.js (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # `next build` also type-checks (tsc), so this gates TypeScript too.
      - name: Build
        run: npm run build
