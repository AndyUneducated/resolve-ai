[project]
name = "resolveai-api"
version = "0.0.1"
description = "ResolveAI · FastAPI + LangGraph 多 Agent 编排后端"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # Agent
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.2",

    # MCP
    "mcp>=1.2",
    "langchain-mcp-adapters>=0.1",

    # DB / Retrieval
    "sqlalchemy[asyncio]>=2.0",  # asyncio extra pulls greenlet (required by create_async_engine)
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "rank-bm25>=0.2",

    # Guardrails
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",

    # Observability
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# 精排重依赖（torch 等）独立成组，base 安装保持轻量；
# Reranker 未装时自动降级到 RRF 融合排序（见 retrieval/reranker.py）。
rerank = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveai_api"]
