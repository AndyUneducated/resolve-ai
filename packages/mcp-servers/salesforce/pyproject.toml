[project]
name = "mcp-server-salesforce"
version = "0.0.1"
description = "Mock Salesforce MCP server for ResolveAI"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0", "pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_servers/salesforce"]
sources = ["src"]

