[project]
name = "mcp-server-zendesk"
version = "0.0.1"
description = "Mock Zendesk MCP server for ResolveAI"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0", "pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_servers/zendesk"]
sources = ["src"]

